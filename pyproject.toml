[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubigraph-citypulse"
version = "1.0.0"
description = "Regression graph condensation and CoSimHeat transfer for CityPulse parking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2", "pandas>=2.2,<3", "scipy>=1.12,<1.15",
  "torch>=2.2,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
vision = ["ultralytics>=8.3,<9"]

[project.scripts]
ubigraph-st = "ubigraph_st.__main__:main"
ubigraph-agent = "ubigraph_agent.server:main"

[tool.setuptools.packages.find]
include = ["ubigraph*"]

[tool.setuptools.package-data]
ubigraph_agent = ["web/*", "english.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
