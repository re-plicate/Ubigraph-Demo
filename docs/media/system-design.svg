<text x="58" y="199.87" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b2d">Ask and inspect</text>
<text x="58" y="240.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Streaming conversation</text>
<text x="58" y="274.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Plan review</text>
<text x="58" y="308.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Mission tracking</text>
<text x="350" y="154.58" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#c9e2bd">ORCHESTRATION</text>
<text x="350" y="199.87" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#ffffff">LLM orchestrator</text>
<text x="350" y="240.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#e5efdf">Typed tools and policy checks</text>
<text x="350" y="274.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#e5efdf">Bounded tool-call loop</text>
<text x="350" y="308.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#e5efdf">Shared Agent Bus</text>
<text x="698" y="154.58" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#617368">SPECIALIST SERVICES</text>
<text x="698" y="199.87" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173b2d">Local computation</text>
<text x="698" y="240.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Data inspection and spatial context</text>
<text x="698" y="274.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Frozen spatiotemporal forecasting</text>
<text x="698" y="308.2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#173b2d">Collection review and fleet simulation</text>
