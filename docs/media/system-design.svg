<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">UbiGraph system design</title><desc id="desc">A user workspace communicates with one LLM orchestrator, which calls specialist services through a shared agent bus. Local models and the fleet simulator compute outputs. SQLite preserves conversations, tool events, plans and mission receipts.</desc><rect width="1120" height="500" rx="18" fill="#f8faf6"/>
<text x="38" y="52.3" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#173b2d">Conversation, tools and evidence</text>
<text x="38" y="85.82" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#617368">One LLM coordinates the workflow. Local services produce the results.</text>
<rect x="38" y="120" width="244" height="218" rx="12" fill="#ffffff" stroke="#d7e2d6"/>
<rect x="330" y="120" width="300" height="218" rx="12" fill="#173b2d"/>
<rect x="678" y="120" width="404" height="218" rx="12" fill="#ffffff" stroke="#d7e2d6"/>
